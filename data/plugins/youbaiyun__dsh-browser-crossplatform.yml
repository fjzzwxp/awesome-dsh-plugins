url: "https://github.com/youbaiyun/dsh-browser-crossplatform"
name: "youbaiyun/dsh-browser-crossplatform"
category: browser
description:
  en: "Browser extension for the DeepSeek Harness desktop app. The model reads the page you are on as text with numbered controls and acts on it — click, type, scroll, navigate, manage tabs — and, when you switch image recognition on, looks at an image you point at. It asks before acting, keeps passwords in the page, and talks to your own desktop; the one."
